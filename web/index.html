<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3f8fc">
  <meta name="description" content="轻量、实时的 Markdown 阅读与编辑器">
  <title>Feather Markdown</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.18.7/dist/katex.min.css">
  <link rel="stylesheet" href="./app.css">
  <script defer src="https://cdn.jsdelivr.net/npm/marked@18.0.13/lib/marked.umd.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.4.15/dist/purify.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.18.7/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.18.7/dist/contrib/auto-render.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/mermaid@12.0.0/dist/mermaid.min.js"></script>
  <script defer src="./app.js"></script>
</head>
<body data-mobile-pane="preview">
  <header class="topbar">
    <div class="brand" aria-label="Feather Markdown">
      <span class="brand-mark" aria-hidden="true"><img src="./icon.svg" alt=""></span>
      <span class="brand-name">Feather</span>
    </div>
    <div class="document-title">
      <span id="document-name">未命名.md</span>
      <span id="save-state" class="save-state">已保存</span>
    </div>
    <nav class="actions" aria-label="文档操作">
      <div class="action-group file-actions">
        <button id="new-button" class="button text-action" type="button" title="新建 (Ctrl+N)">新建</button>
        <button id="open-button" class="button text-action" type="button" title="打开 (Ctrl+O)">打开</button>
        <button id="save-button" class="button primary" type="button" title="保存 (Ctrl+S)">保存</button>
      </div>
      <span class="action-divider" aria-hidden="true"></span>
      <div class="action-group view-actions">
        <button id="editor-toggle-button" class="button editor-toggle" type="button" title="显示编辑器 (Ctrl+Shift+E)" aria-label="显示或隐藏编辑器" aria-pressed="false">
          <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg>
          <span class="button-label">编辑器</span>
        </button>
        <button id="outline-button" class="icon-button" type="button" title="切换大纲" aria-label="切换大纲">
          <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3" cy="6" r="1"/><circle cx="3" cy="12" r="1"/><circle cx="3" cy="18" r="1"/></svg>
        </button>
        <button id="theme-button" class="icon-button" type="button" title="切换主题" aria-label="切换主题">
          <svg class="action-icon theme-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path class="theme-fill" d="M12 3.5a8.5 8.5 0 0 0 0 17Z"/></svg>
        </button>
      </div>
    </nav>
  </header>

  <div class="mobile-tabs editor-hidden" role="tablist" aria-label="移动端视图">
    <button class="mobile-tab hidden" data-pane="editor" role="tab" aria-selected="false">编辑</button>
    <button class="mobile-tab active" data-pane="preview" role="tab" aria-selected="true">预览</button>
    <button class="mobile-tab" data-pane="outline" role="tab" aria-selected="false">大纲</button>
  </div>

  <main class="workspace editor-collapsed">
    <aside id="outline-panel" class="outline-panel" aria-label="文档大纲">
      <div class="panel-heading">
        <span>文档大纲</span>
        <span id="heading-count" class="count-badge">0</span>
      </div>
      <nav id="outline" class="outline"></nav>
      <p id="outline-empty" class="empty-hint">添加标题后会自动生成大纲</p>
    </aside>

    <div id="outline-resizer" class="panel-resizer outline-resizer" role="separator" aria-label="调整文档大纲宽度" aria-orientation="vertical" aria-valuemin="150" aria-valuenow="220" tabindex="0"></div>

    <section id="editor-panel" class="editor-panel hidden" aria-label="Markdown 编辑器">
      <div class="format-bar" aria-label="格式工具栏">
        <span class="format-group">
          <button type="button" data-command="undo" title="撤销 (Ctrl+Z)">↶</button>
          <button type="button" data-command="redo" title="重做 (Ctrl+Y)">↷</button>
        </span>
        <span class="format-group">
          <button type="button" data-format="heading1" title="一级标题">H1</button>
          <button type="button" data-format="heading2" title="二级标题">H2</button>
          <button type="button" data-format="heading3" title="三级标题">H3</button>
        </span>
        <span class="format-group">
          <button type="button" data-format="bold" title="粗体"><strong>B</strong></button>
          <button type="button" data-format="italic" title="斜体"><em>I</em></button>
          <button type="button" data-format="strike" title="删除线"><s>S</s></button>
          <button type="button" data-format="code" title="行内代码">`</button>
        </span>
        <span class="format-group">
          <button type="button" data-format="link" title="链接">⌁</button>
          <button type="button" data-format="image" title="图片">▧</button>
          <button type="button" data-format="quote" title="引用">❯</button>
          <button type="button" data-format="unorderedList" title="无序列表">•≡</button>
          <button type="button" data-format="orderedList" title="有序列表">1≡</button>
          <button type="button" data-format="taskList" title="任务列表">☑</button>
        </span>
        <span class="format-group">
          <button type="button" data-format="codeblock" title="代码块">{ }</button>
          <button type="button" data-format="table" title="表格">▦</button>
          <button type="button" data-format="horizontalRule" title="分隔线">—</button>
          <button type="button" data-format="math" title="数学公式">∑</button>
          <button type="button" data-format="mermaid" title="Mermaid 图">◇</button>
        </span>
      </div>
      <textarea id="editor" spellcheck="false" aria-label="Markdown 内容"></textarea>
      <div class="statusbar">
        <span id="cursor-position">第 1 行，第 1 列</span>
        <span id="document-stats">0 字 · 0 行</span>
      </div>
    </section>

    <div id="editor-resizer" class="panel-resizer editor-resizer" role="separator" aria-label="调整编辑器与预览宽度" aria-orientation="vertical" aria-valuemin="220" aria-valuenow="420" tabindex="0"></div>

    <section id="preview-panel" class="preview-panel" aria-label="实时预览">
      <div class="preview-label">实时预览</div>
      <article id="preview" class="markdown-body"></article>
    </section>
  </main>

  <input id="file-input" type="file" accept=".md,.markdown,.mdown,.mkd,text/markdown,text/plain" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript>Feather Markdown 需要启用 JavaScript。</noscript>
</body>
</html>
