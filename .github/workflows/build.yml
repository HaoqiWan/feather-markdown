name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          cache: false
      - name: Test
        run: go test ./...
      - name: Validate WeChat mini program
        run: node scripts/check-miniprogram.js
      - name: Build all platforms and enforce 10 MiB limit
        run: sh scripts/build.sh "${GITHUB_REF_NAME:-dev}"
      - uses: actions/upload-artifact@v5
        with:
          name: feather-markdown-binaries
          path: dist/
          if-no-files-found: error
