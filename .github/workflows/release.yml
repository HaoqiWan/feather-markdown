name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build without publishing"
        required: true
        default: "0.3.0"

env:
  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          cache: true
      - name: Build native Windows app
        shell: pwsh
        run: |
          $version = "$env:RELEASE_VERSION".TrimStart('v')
          New-Item -ItemType Directory -Force build/windows, release-assets | Out-Null
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go test ./...
          go build -trimpath -buildvcs=false -ldflags "-s -w -buildid= -X main.version=$version -H=windowsgui" -o build/windows/FeatherMarkdown.exe .
          Copy-Item README.md build/windows/README.md
          Compress-Archive -Path build/windows/* -DestinationPath "release-assets/Feather-Markdown-v$version-windows-x64-portable.zip"
      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = "$env:RELEASE_VERSION".TrimStart('v')
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DMyAppVersion=$version" "/DSourceExe=$pwd\build\windows\FeatherMarkdown.exe" "/DOutputDir=$pwd\release-assets" packaging/windows/installer.iss
      - uses: actions/upload-artifact@v5
        with:
          name: release-windows
          path: release-assets/*
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          cache: true
      - name: Build universal macOS app, ZIP, and DMG
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          mkdir -p "build/macos/Feather Markdown.app/Contents/MacOS" release-assets build/dmg
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" go build -trimpath -buildvcs=false \
              -ldflags="-s -w -buildid= -X main.version=$version" -o "build/FeatherMarkdown-$arch" .
          done
          lipo -create build/FeatherMarkdown-amd64 build/FeatherMarkdown-arm64 \
            -output "build/macos/Feather Markdown.app/Contents/MacOS/FeatherMarkdown"
          cp packaging/macos/Info.plist "build/macos/Feather Markdown.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" "build/macos/Feather Markdown.app/Contents/Info.plist"
          codesign --force --deep --sign - "build/macos/Feather Markdown.app"
          ditto -c -k --sequesterRsrc --keepParent "build/macos/Feather Markdown.app" \
            "release-assets/Feather-Markdown-v$version-macos-universal-app.zip"
          cp -R "build/macos/Feather Markdown.app" build/dmg/
          hdiutil create -volname "Feather Markdown" -srcfolder build/dmg -ov -format UDZO \
            "release-assets/Feather-Markdown-v$version-macos-universal.dmg"
      - uses: actions/upload-artifact@v5
        with:
          name: release-macos
          path: release-assets/*
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Decode Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/feather-release.p12"
      - name: Build signed Android APK and ZIP
        working-directory: mobile/android
        shell: bash
        env:
          APP_VERSION: ${{ env.RELEASE_VERSION }}
          APP_VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/feather-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_TYPE: PKCS12
        run: |
          set -euo pipefail
          export APP_VERSION="${APP_VERSION#v}"
          gradle --no-daemon :app:assembleRelease
          mkdir -p ../../release-assets ../../build/android
          version="${RELEASE_VERSION#v}"
          cp app/build/outputs/apk/release/app-release.apk "../../release-assets/Feather-Markdown-v$version-android.apk"
          cp "../../release-assets/Feather-Markdown-v$version-android.apk" ../../build/android/
          cp ../README.md ../../build/android/README.md
          cd ../../build/android
          zip -9 "../../release-assets/Feather-Markdown-v$version-android-app.zip" ./*
      - uses: actions/upload-artifact@v5
        with:
          name: release-android
          path: release-assets/*
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build unsigned iOS app, ZIP, and IPA
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          rm -rf mobile/ios/Resources/web
          mkdir -p mobile/ios/Resources/web release-assets build/ios-payload/Payload
          cp -R web/. mobile/ios/Resources/web/
          cd mobile/ios
          xcodegen generate
          cd ../..
          xcodebuild -project mobile/ios/FeatherMarkdown.xcodeproj -scheme FeatherMarkdown \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$version" CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" build
          app="build/ios/Build/Products/Release-iphoneos/Feather Markdown.app"
          codesign --force --deep --sign - "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" \
            "release-assets/Feather-Markdown-v$version-ios-app-unsigned.zip"
          cp -R "$app" build/ios-payload/Payload/
          cd build/ios-payload
          ditto -c -k --sequesterRsrc --keepParent Payload \
            "../../release-assets/Feather-Markdown-v$version-ios-unsigned.ipa"
      - uses: actions/upload-artifact@v5
        with:
          name: release-ios
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: [windows, macos, android, ios]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify exactly eight release files
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort
          count=$(find release-assets -maxdepth 1 -type f | wc -l)
          test "$count" -eq 8
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "Feather Markdown $GITHUB_REF_NAME" \
            --notes-file packaging/release-notes.md
